---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app_name }}
  labels:
    app: {{ .Values.app_name }}
    app.kubernetes.io/component: {{ .Values.app_name }}
    app.kubernetes.io/instance: {{ .Values.app_name }}
spec:
  ports:
    # Only the proxy port is exposed. code-server binds 127.0.0.1 and has no
    # Service of its own, so it is unreachable from outside the pod.
    - name: http
      port: 80
      protocol: TCP
      targetPort: {{ .Values.PROXY_PORT }}
  selector:
    {{- include "helm.selectorLabels" . | nindent 4 }}
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app_name }}-headless
  labels:
    app: {{ .Values.app_name }}
spec:
  clusterIP: None
  selector:
    {{- include "helm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.PROXY_PORT }}
