apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.app_name }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    # Makes this ServiceAccount an OAuth client. oauth-proxy authenticates
    # against the cluster's identity provider on its behalf, so there is no
    # separate password to manage or rotate.
    serviceaccounts.openshift.io/oauth-redirecturi.primary: "https://{{ template "ingress.hostName" . }}"
{{/*
Cluster-scoped, so the AppProject must whitelist ClusterRoleBinding for ArgoCD
to be allowed to create it. The shared `dev` project permits only Namespace,
and widening it would let every dev application mint cluster RBAC - too much
for one personal tool. Leave this false and apply the binding out of band, the
same way the secrets are handled. Kept in the chart for any project that does
permit it.
*/}}
{{- if .Values.rbac.clusterReader }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.app_name }}-cluster-reader
  labels:
    {{- include "helm.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.app_name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # cluster-reader, not view. `view` is namespace-oriented and covers none of
  # nodes, PVs, storage classes or volumeattachments - which is most of what a
  # diagnostic session actually reads. cluster-reader covers them and still
  # excludes secrets.
  name: cluster-reader
{{- end }}
